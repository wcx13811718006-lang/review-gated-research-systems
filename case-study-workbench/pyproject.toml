[project]
name = "carwash-automation"
version = "0.1.0"
description = "Evidence-first CAR-WASH case study automation scaffold"
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.0",
  "httpx>=0.27",
  "pymupdf>=1.24",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.5",
  "mypy>=1.10",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]
