name: case-study-workbench

on:
  pull_request:
    paths:
      - "case-study-workbench/**"
      - ".github/workflows/case-study-workbench.yml"
  push:
    branches:
      - main
    paths:
      - "case-study-workbench/**"
      - ".github/workflows/case-study-workbench.yml"

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: case-study-workbench
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Test
        run: python -m pytest
      - name: Lint
        run: ruff check .
      - name: Type check
        run: mypy src
