dynamic_context_policy:
  allowed:
    - reorder already approved cards
    - show timestamp and official data source
    - show current context label
  prohibited:
    - generate health or safety advice
    - rewrite approved case claims
    - imply a case is effective in a current event
    - block the main page when an API fails

